server {
    listen 80;
    server_name _;

    root /var/www/futbolx;
    index index.html;

    # Static assets
    location /assets/ {
        try_files $uri =404;
    }

    location /chat/ {
        try_files $uri $uri/ =404;
    }

    location /auth/ {
        try_files $uri $uri/ =404;
    }

    # Vercel-compatible API routes
    location = /api/stream {
        try_files /api/stream.json =404;
    }

    location = /api/stream-24-7 {
        try_files /api/stream-24-7.js =404;
    }

    location = /api/epg {
        try_files /api/epg.js =404;
    }

    location = /api/token {
        try_files /api/token.js =404;
    }

    # Static JSON API files
    location ~ ^/api/(.*\.json)$ {
        try_files /api/$1 =404;
    }

    # Other API files
    location /api/ {
        try_files $uri =404;
    }

    # Special pages
    location = /auth/login {
        try_files /auth/login.html =404;
    }

    location = /auth/signup {
        try_files /auth/signup.html =404;
    }

    location = /dashboard {
        try_files /dashboard.html =404;
    }

    location ~ ^/live/ {
        try_files /live.html =404;
    }

    location ~ ^/live-24-7/ {
        try_files /live-24-7.html =404;
    }

    location = /vip {
        try_files /vip.html =404;
    }

    location = /24-7 {
        try_files /24-7.html =404;
    }

    # Everything else → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
